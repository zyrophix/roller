name: CI
on:
  push:
    branches: [main, b/cpp-layershell]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev liblayer-shell-qt-dev cmake ninja-build jq imagemagick
      - name: Configure
        run: cmake -B build -S . -G Ninja
      - name: Build
        run: cmake --build build
      - name: Lint QML
        run: qmllint qml/*.qml
