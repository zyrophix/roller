name: CI
on:
  push:
    branches: [main, b/cpp-layershell]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Configure
        # Ubuntu packages layer-shell-qt on 22.04 only, and the runner is
        # newer. The opt-out is explicit so the resulting warning is in the log
        # rather than the dependency being silently missing.
        run: cmake -B build -S . -G Ninja -DROLLER_ALLOW_NO_LAYER_SHELL=ON
      - name: Lint QML
        run: cmake --build build --target all_qmllint
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
